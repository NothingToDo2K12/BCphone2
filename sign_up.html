<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/sign-style.css" />
    <link rel="stylesheet" href="css/sign-style-res.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script src="js/Auth.js" defer></script>
    <script src="js/Sign_up.js" defer></script>
    <script src="js/phonedb.js" defer></script>
    <script src="js/search.js" defer></script>
    <title>BCphone - Tin tức</title>
    
</head>


<body>

    <div class="login-page">
        <img style="width: 30%; height:30% ; object-fit: contain;" class="login-image" src="./img/man.png" alt="login illustration">
        <div class="boxuser">
            <div class="boxinfor">
                <form id="signup-form" class="boxname">
                    <h3>Sign up</h3>
                    <label for="signup-username">Tên đăng nhập</label>
                    <input id="signup-username" name="username" type="text" placeholder="Tạo tên đăng nhập" autocomplete="username" minlength="3" maxlength="24" required>
                    <label for="signup-password">Mật khẩu</label>
                    <input id="signup-password" name="password" type="password" placeholder="Tạo mật khẩu (ít nhất 8 ký tự)" autocomplete="new-password" minlength="8" required>
                    <p class="auth-note">Bản thử nghiệm lưu tài khoản trên trình duyệt này, chưa dùng backend.</p>
                    <p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
                    <button type="submit">Tạo tài khoản</button>
                    <a href="sign_in.html">Have account</a>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
