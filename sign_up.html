</head>


<body>

    <nav class="navbar navbar-expand-sm align-items-center maunen">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center me-3" href="#">
                <img src="./img/smartphone.png" alt="Logo" class="img-fluid" style="max-height: 30px; width: auto;">
                <p class="brand-name">BCPhone</p>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavId"
                aria-controls="collapsibleNavId" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavId">
                <ul class="navbar-nav mt-2 mt-lg-0 menuframe">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html" aria-current="page">Phone <span
                                class="visually-hidden">(current)</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="news.html">News</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                </ul>

                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <div class="marbutton">
                    <div class="nav-button">
                        <a id="nav-button-signup" href="sign_up.html">
                            <button>
                                <img src="./img/add-user.png" alt="user" /> Sign up
                            </button></a>
                    </div>
                    <div class="nav-button">
                        <a id="nav-button-signin" href="sign_in.html">
                            <button>
                                <img src="./img/user.png" alt="user" /> Sign in
                            </button></a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="login-page">
        <img style="width: 30%; height:30% ; object-fit: contain;" class="login-image" src="./img/man.png" alt="login illustration">
        <div class="boxuser">
            <div class="boxinfor">
                <form id="signup-form" class="boxname">
                    <h3>Sign up</h3>
                    <label for="signup-username">Tên đăng nhập</label>
                    <input id="signup-username" name="username" type="text" placeholder="Tạo tên đăng nhập" autocomplete="username" minlength="3" maxlength="24" required>
                    <label for="signup-password">Mật khẩu</label>
                    <input id="signup-password" name="password" type="password" placeholder="Tạo mật khẩu (ít nhất 8 ký tự)" autocomplete="new-password" minlength="8" required>
                    <p class="auth-note">Bản thử nghiệm lưu tài khoản trên trình duyệt này, chưa dùng backend.</p>
                    <p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
                    <button type="submit">Tạo tài khoản</button>
                    <a href="sign_in.html">Have account</a>
                </form>
            </div>
        </div>
    </div>
</body>
