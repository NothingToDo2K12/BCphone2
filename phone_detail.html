<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết điện thoại</title>
    <link rel="stylesheet" href="chi_tiet_phone-style.css">
    <link rel="stylesheet" href="chi_tiet_phone-style-res.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Link JavaScript Bootstrap (Bắt buộc phải có để slide tự chạy và bấm chuyển được) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/Auth.js" defer></script>
    <script src="js/phonedb.js" defer></script>
    <script src="js/loadHTML.js" defer></script>
    <script src="js/phone_detail.js" defer></script>
    <script src="js/search.js" defer></script>

</head>

<body>
    <div id="header-container"></div>

    <!-- CONTAINER CHÍNH CỦA TRANG CHI TIẾT -->
    <div class="detail-container">

        <!-- PHẦN 1: TỔNG QUAN (ẢNH VÀ THÔNG TIN MUA HÀNG) -->
        <div class="product-overview">
            <!-- Khung chứa Slide ảnh Bootstrap (Vẫn giữ class product-image-box để lấy viền đen và chống méo từ CSS của bạn) -->
            <div class="product-image-box carousel slide" id="phoneCarousel" data-bs-ride="carousel">

                <!-- Cụm các dấu chấm/vạch nhỏ dưới đáy slide -->
                <div class="carousel-indicators">
                </div>

                <!-- Danh sách các hình ảnh điện thoại -->
                <div class="carousel-inner h-100 w-100 d-flex align-items-center">
                    
                </div>

                <!-- Hai nút mũi tên điều hướng qua lại (Trái / Phải) -->
                <button class="carousel-control-prev" type="button" data-bs-target="#phoneCarousel"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true" style="filter: invert(1);"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#phoneCarousel"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true" style="filter: invert(1);"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
            
            <!-- Khung chứa thông tin tên, giá, nút bấm -->
            <div class="product-info-box">
                <h1 class="product-name">Đang tải...</h1>
                <p class="product-price"></p>
                <p class="product-desc"></p>
                <p id="detailMessage" role="status"></p>

                <div class="action-buttons">
                    <button class="btn-buy-now">Mua ngay</button>
                    <button class="btn-add-cart">Thêm vào giỏ</button>
                </div>
            </div>
        </div>

        <!-- PHẦN 2: BẢNG THÔNG SỐ KỸ THUẬT -->
        <div class="specs-section">
            <h2 class="specs-title">Thông số kỹ thuật</h2>

            <table class="specs-table">
                <tr>
                    <td class="spec-label">Màn hình</td>
                    <td class="spec-value" data-spec="screen_resolution">—</td>
                </tr>
                <tr>
                    <td class="spec-label">Hệ điều hành</td>
                    <td class="spec-value" data-spec="os">—</td>
                </tr>
                <tr>
                    <td class="spec-label">Camera sau</td>
                    <td class="spec-value" data-spec="main_camera">—</td>
                </tr>
                <tr>
                    <td class="spec-label">Camera trước</td>
                    <td class="spec-value" data-spec="front_camera">—</td>
                </tr>
                <tr>
                    <td class="spec-label">Chip xử lý (CPU)</td>
                    <td class="spec-value" data-spec="cpu">—</td>
                </tr>
                <tr>
                    <td class="spec-label">Dung lượng lưu trữ</td>
                    <td class="spec-value" data-spec="storage">—</td>
                </tr>
                <tr>
                    <td class="spec-label">Cổng kết nối</td>
                    <td class="spec-value" data-spec="connected_port">—</td>
                </tr>
                <tr>
                    <td class="spec-label">Dung lượng pin</td>
                    <td class="spec-value" data-spec="battery_capacity">—</td>
                </tr>
                <tr>
                    <td class="spec-label">Mạng và kết nối</td>
                    <td class="spec-value" data-spec="networks">—</td>
                </tr>
                <tr>
                    <td class="spec-label">Chất liệu</td>
                    <td class="spec-value" data-spec="material">—</td>
                </tr>
            </table>
        </div>

    </div>

    <div id="footer-container"></div>

</body>

</html>
