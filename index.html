  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const signupLink = document.getElementById('nav-button-signup');
      const signinLink = document.getElementById('nav-button-signin');
      const links = [signupLink, signinLink].filter(Boolean);

      const currentPage = window.location.pathname.split('/').pop().toLowerCase();
      if (currentPage === 'sign_up.html') {
        signupLink?.classList.add('active');
      } else if (currentPage === 'sign_in.html') {
        signinLink?.classList.add('active');
      }

      links.forEach(function (link) {
        link.addEventListener('click', function () {
          links.forEach(function (item) {
            item.classList.remove('active');
          });
          this.classList.add('active');
        });
      });
    });
  </script>
